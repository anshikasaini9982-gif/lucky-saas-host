<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Code Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body { background-color: #070b14; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
        .vault-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .table-custom { color: #f8fafc; font-size: 13px; width: 100%; border-collapse: separate; border-spacing: 0 6px; }
        .table-custom th { background: #1e293b; color: #94a3b8; border: none; padding: 12px; font-weight: 700; }
        .table-custom td { background: #131d31; border: none; vertical-align: middle; padding: 12px; }
        .table-custom tr td:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .table-custom tr td:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        pre code { font-family: 'Courier New', Courier, monospace; color: #38bdf8; }
    </style>
</head>
<body class="py-4">

<div class="container-fluid" style="max-width: 1200px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-info mb-0"><i class="fa-solid fa-code-branch me-2"></i>CLIENT CODE VAULT</h3>
            <small class="text-secondary">View & Download all uploaded Python scripts</small>
        </div>
        <div class="d-flex gap-2">
            <a href="/admin" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-chart-pie me-1"></i> Admin Hub</a>
            <a href="/" class="btn btn-outline-info btn-sm">User View</a>
        </div>
    </div>

    <div class="vault-card">
        <h5 class="fw-bold text-light mb-3"><i class="fa-solid fa-folder-open text-warning me-2"></i>All Uploaded Client Scripts</h5>
        
        <div class="table-responsive">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>Script Name</th>
                        <th>Author</th>
                        <th>Engine Status</th>
                        <th>Upload Date</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="botVaultBody">
                    <tr><td colspan="5" class="text-center text-secondary py-4">Loading client scripts...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="codeModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title fw-bold" id="modalFileName">Python Script Viewer</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <pre class="p-3 bg-black m-0" style="max-height: 500px; overflow-y: auto;"><code id="codeViewerContent">Loading code...</code></pre>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function loadBotVault() {
    try {
        const res = await fetch('/api/admin/all_bots');
        const data = await res.json();

        const tbody = document.getElementById('botVaultBody');
        if (data.bots.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">Koi bot script uploaded nahi hai.</td></tr>';
            return;
        }

        let html = '';
        data.bots.forEach(b => {
            const statusBadge = b.is_running 
                ? '<span class="badge bg-success">Running 24x7</span>' 
                : '<span class="badge bg-dark border border-secondary">Stopped</span>';

            html += `
                <tr>
                    <td><i class="fa-brands fa-python text-warning me-2 fs-5"></i><b>${b.filename}</b></td>
                    <td><span class="badge bg-secondary">${b.username}</span> (ID: ${b.user_id})</td>
                    <td>${statusBadge}</td>
                    <td>${b.created_at}</td>
                    <td class="text-end">
                        <button onclick="viewBotCode(${b.id})" class="btn btn-info btn-sm me-1"><i class="fa-solid fa-eye"></i> View Code</button>
                        <a href="/admin/download_bot/${b.id}" class="btn btn-success btn-sm"><i class="fa-solid fa-download"></i> Download .py</a>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    } catch(err) {
        console.error("Vault Load Error:", err);
    }
}

async function viewBotCode(botId) {
    const modal = new bootstrap.Modal(document.getElementById('codeModal'));
    document.getElementById('codeViewerContent').innerText = "Fetching code from server...";
    modal.show();

    try {
        const res = await fetch(`/api/admin/view_code/${botId}`);
        const data = await res.json();
        if (data.code) {
            document.getElementById('modalFileName').innerText = data.filename;
            document.getElementById('codeViewerContent').innerText = data.code;
        } else {
            document.getElementById('codeViewerContent').innerText = "File khali hai ya nahi mili!";
        }
    } catch(err) {
        document.getElementById('codeViewerContent').innerText = "Error loading code: " + err;
    }
}

loadBotVault();
</script>
</body>
</html>
