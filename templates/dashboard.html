<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Cloud Bot Hosting</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body { 
            background: #060911; 
            color: #f1f5f9; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-box { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 18px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); 
        }

        .top-navbar-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.15);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .brand-title { 
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-weight: 800; 
            font-size: 1.25rem;
        }

        .coin-glow-pill { 
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.18) 0%, rgba(217, 119, 6, 0.25) 100%); 
            border: 1.5px solid rgba(251, 191, 36, 0.6); 
            color: #fef08a; 
            border-radius: 50px; 
            padding: 7px 14px; 
            font-weight: 800; 
            font-size: 13px;
            text-decoration: none; 
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
        }

        .vip-glow-pill { 
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); 
            color: #fff; 
            border-radius: 50px; 
            padding: 7px 14px; 
            font-weight: 800; 
            font-size: 12px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
        }

        .btn-store-glow {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #04101e !important;
            font-weight: 800;
            border-radius: 50px;
            padding: 7px 16px;
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.35);
        }

        .btn-logout-glow {
            background: rgba(244, 63, 94, 0.12);
            color: #f43f5e !important;
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            text-decoration: none;
        }

        .bot-item { 
            background: #111827; 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            border-radius: 14px; 
            padding: 14px 18px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .pulse-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse 1.5s infinite; }
        @keyframes pulse { to { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } }

        /* 💬 FLOATING SUPPORT BUTTON (BOTTOM-RIGHT) */
        .floating-support-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #04101e !important;
            font-weight: 800;
            font-size: 14px;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4), 0 0 15px rgba(0, 242, 254, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            z-index: 9999;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .floating-support-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body class="py-3">

<div class="container" style="max-width: 920px;">
    <!-- Top Navbar Bar -->
    <div class="top-navbar-card p-3 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <h4 class="brand-title mb-0" id="dashBrandName">⚡ CLOUD HOSTING</h4>
            <small class="text-secondary" style="font-size: 11px;">Client: <b id="navUsername" class="text-info">...</b></small>
        </div>
        
        <!-- Right Action Items -->
        <div class="d-flex align-items-center gap-2">
            <div id="badgeContainer"></div>
            <a href="/store" class="btn-store-glow"><i class="fa-solid fa-bag-shopping"></i> Store</a>
            <a href="/logout" class="btn-logout-glow" title="Logout"><i class="fa-solid fa-power-off"></i></a>
        </div>
    </div>

    <!-- Notice Banner -->
    <div class="alert alert-info py-2 small mb-4 bg-dark text-info border-secondary" id="noticeBox">
        <i class="fa-solid fa-bullhorn me-1"></i> <span id="noticeText">Loading announcement...</span>
    </div>

    <!-- Upload Bot Script -->
    <div class="glass-box p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0 fw-bold text-info"><i class="fa-solid fa-cloud-arrow-up me-2"></i>Upload & Host Python Bot</h6>
            <span class="badge bg-secondary">Cost: 5 Coins / Bot Launch</span>
        </div>
        <form onsubmit="handleUpload(event)" class="d-flex gap-2">
            <input type="file" id="botFileInput" class="form-control bg-dark text-white border-secondary" accept=".py" required>
            <button type="submit" class="btn btn-primary px-4 fw-bold" id="uploadBtn"><i class="fa-solid fa-upload"></i> Upload</button>
        </form>
    </div>

    <!-- Active Bots Container -->
    <div class="glass-box p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0"><i class="fa-solid fa-server me-2"></i>My Deployed Instances</h6>
            <span class="badge bg-primary">24x7 Auto-Revive</span>
        </div>

        <div id="botListContainer">
            <div class="text-center py-4 text-secondary">
                <i class="fa-solid fa-spinner fa-spin fa-2x mb-2"></i>
                <div>Loading Bots...</div>
            </div>
        </div>
    </div>
</div>

<!-- 💬 24/7 Live Floating Support Button (Bottom-Right) -->
<a href="https://t.me/BYLUCKSUPPORTBOT" target="_blank" class="floating-support-btn">
    <i class="fa-solid fa-headset fs-5"></i>
    <span>24/7 Support</span>
</a>

<script>
async function loadUserData() {
    try {
        const res = await fetch('/api/user_data');
        const data = await res.json();

        document.getElementById('dashBrandName').innerText = '⚡ ' + data.site_name;
        document.title = data.site_name + " | Dashboard";
        document.getElementById('navUsername').innerText = data.user.username;
        document.getElementById('noticeText').innerText = data.notice;

        const bCont = document.getElementById('badgeContainer');
        if (data.user.is_vip) {
            bCont.innerHTML = '<span class="vip-glow-pill"><i class="fa-solid fa-crown"></i> VIP ACCESS</span>';
        } else {
            bCont.innerHTML = `
                <a href="/store" class="coin-glow-pill">
                    <i class="fa-solid fa-coins text-warning fs-6"></i> 
                    <span>${data.user.coins} Coins</span>
                </a>
            `;
        }

        const listCont = document.getElementById('botListContainer');
        if (data.bots.length === 0) {
            listCont.innerHTML = `
                <div class="text-center py-5 text-secondary">
                    <i class="fa-solid fa-box-open fa-3x mb-3 text-muted"></i>
                    <h6>No Bots Uploaded Yet</h6>
                    <p class="small">Upload your .py script above to instantly launch your bot.</p>
                </div>
            `;
            return;
        }

        let html = '';
        data.bots.forEach(b => {
            const statusHtml = b.is_running 
                ? '<span class="pulse-dot me-1"></span> <span class="text-success">Running 24x7</span>'
                : '<span class="text-secondary">● Stopped</span>';

            const actionBtn = b.is_running
                ? `<button onclick="botAction(${b.id}, 'stop')" class="btn btn-warning btn-sm fw-bold"><i class="fa-solid fa-pause"></i> Stop</button>`
                : `<button onclick="botAction(${b.id}, 'start')" class="btn btn-success btn-sm fw-bold"><i class="fa-solid fa-play"></i> Launch (5 Coins)</button>`;

            html += `
                <div class="bot-item">
                    <div class="d-flex align-items-center gap-2">
                        <i class="fa-brands fa-python text-warning fs-4"></i>
                        <div>
                            <div class="fw-bold text-white">${b.filename}</div>
                            <small>${statusHtml}</small>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        ${actionBtn}
                        <button onclick="botAction(${b.id}, 'delete')" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        listCont.innerHTML = html;
    } catch(err) {
        console.error(err);
    }
}

async function handleUpload(e) {
    e.preventDefault();
    const file = document.getElementById('botFileInput').files[0];
    if (!file) return;

    const fd = new FormData();
    fd.append('file', file);

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

    await fetch('/api/upload_bot', { method: 'POST', body: fd });
    document.getElementById('botFileInput').value = '';
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-upload"></i> Upload';
    loadUserData();
}

async function botAction(botId, action) {
    if (action === 'delete' && !confirm('Are you sure to delete this bot?')) return;
    const res = await fetch(`/api/bot_action/${botId}/${action}`);
    const data = await res.json();
    if (!data.success && data.msg) alert(data.msg);
    loadUserData();
}

loadUserData();
setInterval(loadUserData, 3000);
</script>
</body>
</html>
