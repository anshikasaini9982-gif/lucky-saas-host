<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body { background: #070b14; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .brand-title { background: linear-gradient(135deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .coin-pill { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; border-radius: 30px; padding: 6px 16px; font-weight: 700; text-decoration: none; }
        .vip-pill { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff; border-radius: 30px; padding: 6px 16px; font-weight: 700; }
        .bot-item { background: #131d31; border: 1px solid #233352; border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .pulse-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse 1.5s infinite; }
        @keyframes pulse { to { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } }
    </style>
</head>
<body class="py-4">

<div class="container" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="brand-title mb-0" id="dashBrandName">⚡ CLOUD HOSTING</h3>
            <small class="text-secondary">Welcome, <b id="navUsername" class="text-info">User</b></small>
        </div>
        <div class="d-flex align-items-center gap-2">
            <div id="badgeContainer"></div>
            <a href="/store" class="btn btn-warning btn-sm fw-bold"><i class="fa-solid fa-cart-shopping me-1"></i> Store</a>
            <a href="/logout" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-power-off"></i></a>
        </div>
    </div>

    <div class="alert alert-info py-2 small mb-4 bg-dark text-info border-secondary" id="noticeBox">
        <i class="fa-solid fa-bullhorn me-1"></i> <span id="noticeText">Loading announcement...</span>
    </div>

    <div class="glass-box p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0 fw-bold text-info"><i class="fa-solid fa-cloud-arrow-up me-2"></i>Upload & Host Python Bot</h6>
            <span class="badge bg-secondary">Cost: 5 Coins / Bot Launch</span>
        </div>
        <form onsubmit="handleUpload(event)" class="d-flex gap-2">
            <input type="file" id="botFileInput" class="form-control bg-dark text-white border-secondary" accept=".py" required>
            <button type="submit" class="btn btn-primary px-4 fw-bold" id="uploadBtn"><i class="fa-solid fa-upload"></i> Upload</button>
        </form>
    </div>

    <div class="glass-box p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0"><i class="fa-solid fa-server me-2"></i>My Deployed Instances</h6>
            <span class="badge bg-primary">24x7 Auto-Revive</span>
        </div>

        <div id="botListContainer">
            <div class="text-center py-4 text-secondary">
                <i class="fa-solid fa-spinner fa-spin fa-2x mb-2"></i>
                <div>Loading Bots...</div>
            </div>
        </div>
    </div>
</div>

<script>
async function loadUserData() {
    try {
        const res = await fetch('/api/user_data');
        const data = await res.json();

        document.getElementById('dashBrandName').innerText = '⚡ ' + data.site_name;
        document.title = data.site_name + " | Dashboard";
        document.getElementById('navUsername').innerText = data.user.username;
        document.getElementById('noticeText').innerText = data.notice;

        const bCont = document.getElementById('badgeContainer');
        if (data.user.is_vip) {
            bCont.innerHTML = '<span class="vip-pill"><i class="fa-solid fa-crown me-1"></i> VIP UNLIMITED</span>';
        } else {
            bCont.innerHTML = `<a href="/store" class="coin-pill"><i class="fa-solid fa-coins me-1"></i> ${data.user.coins} Coins <i class="fa-solid fa-plus ms-1 small"></i></a>`;
        }

        const listCont = document.getElementById('botListContainer');
        if (data.bots.length === 0) {
            listCont.innerHTML = `
                <div class="text-center py-5 text-secondary">
                    <i class="fa-solid fa-box-open fa-3x mb-3 text-muted"></i>
                    <h6>No Bots Uploaded Yet</h6>
                    <p class="small">Upload your .py script above to instantly launch your bot.</p>
                </div>
            `;
            return;
        }

        let html = '';
        data.bots.forEach(b => {
            const statusHtml = b.is_running 
                ? '<span class="pulse-dot me-1"></span> <span class="text-success">Running 24x7</span>'
                : '<span class="text-secondary">● Stopped</span>';

            const actionBtn = b.is_running
                ? `<button onclick="botAction(${b.id}, 'stop')" class="btn btn-warning btn-sm fw-bold"><i class="fa-solid fa-pause"></i> Stop</button>`
                : `<button onclick="botAction(${b.id}, 'start')" class="btn btn-success btn-sm fw-bold"><i class="fa-solid fa-play"></i> Launch (5 Coins)</button>`;

            html += `
                <div class="bot-item">
                    <div class="d-flex align-items-center gap-2">
                        <i class="fa-brands fa-python text-warning fs-4"></i>
                        <div>
                            <div class="fw-bold text-white">${b.filename}</div>
                            <small>${statusHtml}</small>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        ${actionBtn}
                        <button onclick="botAction(${b.id}, 'delete')" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
        listCont.innerHTML = html;
    } catch(err) {
        console.error(err);
    }
}

async function handleUpload(e) {
    e.preventDefault();
    const file = document.getElementById('botFileInput').files[0];
    if (!file) return;

    const fd = new FormData();
    fd.append('file', file);

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

    await fetch('/api/upload_bot', { method: 'POST', body: fd });
    document.getElementById('botFileInput').value = '';
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-upload"></i> Upload';
    loadUserData();
}

async function botAction(botId, action) {
    if (action === 'delete' && !confirm('Are you sure to delete this bot?')) return;
    const res = await fetch(`/api/bot_action/${botId}/${action}`);
    const data = await res.json();
    if (!data.success && data.msg) alert(data.msg);
    loadUserData();
}

loadUserData();
setInterval(loadUserData, 3000);
</script>
</body>
</html>
