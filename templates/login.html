<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body { background: #070b14; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); width: 100%; max-width: 440px; padding: 35px; }
        .brand-title { background: linear-gradient(135deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .form-control { background: #131d31; border: 1px solid #233352; color: #fff; border-radius: 10px; padding: 12px; }
        .form-control:focus { background: #18243d; border-color: #00f2fe; color: #fff; box-shadow: 0 0 10px rgba(0,242,254,0.3); }
        .btn-glow { background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; color: #04101e; font-weight: 700; border-radius: 10px; padding: 12px; }
        .nav-tabs .nav-link { color: #94a3b8; font-weight: 600; border: none; }
        .nav-tabs .nav-link.active { color: #00f2fe; background: transparent; border-bottom: 2px solid #00f2fe; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <h2 class="brand-title mb-1" id="siteBrandName">⚡ CLOUD HOSTING</h2>
        <p class="text-secondary small">Python Bot Platform (5 Coins Free)</p>
    </div>

    <div id="authAlert" class="d-none alert py-2 small mb-3"></div>

    <ul class="nav nav-tabs nav-fill mb-4">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#loginTab">Login</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#signupTab">Register (+5 Coins)</a></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="loginTab">
            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label small text-secondary">Username or Email</label>
                    <input type="text" id="loginUsername" class="form-control" required placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary">Password</label>
                    <input type="password" id="loginPassword" class="form-control" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-glow w-100 mb-3"><i class="fa-solid fa-right-to-bracket me-1"></i> Sign In</button>
            </form>
        </div>

        <div class="tab-pane fade" id="signupTab">
            <form onsubmit="handleSignup(event)">
                <div class="mb-3">
                    <label class="form-label small text-secondary">Choose Username</label>
                    <input type="text" id="regUsername" class="form-control" required placeholder="Ex: lucky_coder">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary">Set Password</label>
                    <input type="password" id="regPassword" class="form-control" required placeholder="Password">
                </div>
                <button type="submit" class="btn btn-glow w-100"><i class="fa-solid fa-gift me-1"></i> Register & Get 5 Coins</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function loadBrand() {
    try {
        const res = await fetch('/api/site_info');
        const data = await res.json();
        document.getElementById('siteBrandName').innerText = '⚡ ' + data.site_name;
        document.title = data.site_name + " | Auth";
    } catch(e){}
}
loadBrand();

function showAlert(msg, type) {
    const el = document.getElementById('authAlert');
    el.className = `alert alert-${type} py-2 small mb-3`;
    el.innerText = msg;
    el.classList.remove('d-none');
}

async function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('loginUsername').value;
    const p = document.getElementById('loginPassword').value;

    const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = data.is_admin ? '/admin' : '/';
    } else {
        showAlert(data.msg, 'danger');
    }
}

async function handleSignup(e) {
    e.preventDefault();
    const u = document.getElementById('regUsername').value;
    const em = document.getElementById('regEmail').value;
    const p = document.getElementById('regPassword').value;

    const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, email: em, password: p })
    });
    const data = await res.json();
    if (data.success) {
        showAlert(data.msg, 'success');
        setTimeout(() => location.reload(), 1500);
    } else {
        showAlert(data.msg, 'danger');
    }
}
</script>
</body>
</html>
